<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seus dados · Encanto Pet</title>

  <!-- Ícone da aba do navegador -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">

  <!-- Fonte, estilo (CSS) e JavaScript -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js"></script>
</head>
<body>

  <header>
    <a class="logo" href="../pagina-principal.html">
      <img src="../assets/images/logo.jpeg" alt="Logo do Encanto Pet">
      Encanto <b>Pet</b>
    </a>
    <div class="acoes-topo">
      <button type="button" class="botao-tema" data-botao-tema title="Trocar entre modo claro e escuro" aria-label="Trocar entre modo claro e escuro">🌓</button>
    </div>
  </header>

  <!-- Barra de Progresso -->
  <div class="conteiner-etapas">
    <div class="etapa-item ativa">
      <div class="icone-etapa">👤</div>
      <span class="texto-etapa">Seus dados</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item">
      <div class="icone-etapa">🐶</div>
      <span class="texto-etapa">Dados do pet</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item">
      <div class="icone-etapa">✂️</div>
      <span class="texto-etapa">Serviço</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item">
      <div class="icone-etapa">📅</div>
      <span class="texto-etapa">Dia e horário</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item">
      <div class="icone-etapa">✅</div>
      <span class="texto-etapa">Confirmação</span>
    </div>
  </div>

  <main class="conteudo">

    <form class="formulario" data-proxima="dados-pet.html">
      <h2 class="titulo">Seus dados</h2>
      <p class="subtitulo">Etapa 1 de 5</p>

      <!-- Nome -->
      <label class="label" for="nome">Nome completo</label>
      <input class="campo" type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

      <!-- Telefone -->
      <label class="label" for="telefone"><span class="icone-campo">📞</span>Número de telefone</label>
      <input class="campo" type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

      <!-- Endereço -->
      <label class="label" for="endereco"><span class="icone-campo">📍</span>Endereço</label>
      <textarea class="campo" id="endereco" name="endereco" placeholder="Digite seu endereço completo" required></textarea>

      <!-- Botões -->
      <div class="botoes">
        <a class="botao voltar" href="login.html">Voltar</a>
        <button class="botao continuar" type="submit">Continuar</button>
      </div>
    </form>

  </main>

</body>
</html>
