<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dia e horário · Encanto Pet</title>

  <!-- Ícone da aba do navegador -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">

  <!-- Fonte, estilo (CSS) e JavaScript -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/script.js"></script>
  <script type="module" src="../js/api.js"></script>
</head>
<body>

  <header>
    <a class="logo" href="../pagina-principal.html">
      <img src="../assets/images/logo.jpeg" alt="Logo do Encanto Pet">
      Encanto <b>Pet</b>
    </a>
    <div class="acoes-topo">
      <button type="button" class="botao-tema" data-botao-tema title="Trocar entre modo claro e escuro" aria-label="Trocar entre modo claro e escuro">🌓</button>
    </div>
  </header>

  <!-- Barra de Progresso -->
  <div class="conteiner-etapas">
    <div class="etapa-item concluida">
      <div class="icone-etapa">👤</div>
      <span class="texto-etapa">Seus dados</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item concluida">
      <div class="icone-etapa">🐶</div>
      <span class="texto-etapa">Dados do pet</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item concluida">
      <div class="icone-etapa">✂️</div>
      <span class="texto-etapa">Serviço</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item ativa">
      <div class="icone-etapa">📅</div>
      <span class="texto-etapa">Dia e horário</span>
    </div>
    <div class="linha-conectora"></div>
    <div class="etapa-item">
      <div class="icone-etapa">✅</div>
      <span class="texto-etapa">Confirmação</span>
    </div>
  </div>

  <main class="conteudo">

    <form class="formulario" data-proxima="confirmacao.html">
      <h2 class="titulo">Dia e horário</h2>
      <p class="subtitulo">Etapa 4 de 5</p>

      <label class="label" for="data">Dia</label>
      <input class="campo" type="date" id="data" name="data" required>

      <p class="label">Horário</p>
      <div class="lista-horarios">

        <label class="horario">
          <input type="radio" name="horario" value="08:00" required>
          <span>08:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="09:00" required>
          <span>09:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="10:00" required>
          <span>10:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="11:00" required>
          <span>11:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="13:00" required>
          <span>13:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="14:00" required>
          <span>14:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="15:00" required>
          <span>15:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="16:00" required>
          <span>16:00</span>
        </label>

        <label class="horario">
          <input type="radio" name="horario" value="17:00" required>
          <span>17:00</span>
        </label>

      </div>

      <label class="label" for="observacoes">Observações (opcional)</label>
      <textarea class="campo" id="observacoes" name="observacoes" placeholder="Ex.: meu pet tem medo do secador"></textarea>

      <div class="botoes">
        <a class="botao voltar" href="servicos.html">Voltar</a>
        <button class="botao continuar" type="submit">Continuar</button>
      </div>
    </form>

  </main>

</body>
</html>
