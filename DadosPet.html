<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Encanto Pet</title>
    <link rel="stylesheet" href="DadosPet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<header class="cabecalho-principal">
    <img src="Logo.jpeg" alt="Logo Encanto PET" class="imagem-logo">
    <h1 class="titulo-cabecalho">Encanto </h1>
    <h1 class="destaque-pet"> Pet</h1>

</header>

    <!-- Barra de Progresso -->
    <div class="conteiner-etapas">
        <div class="etapa-item concluida">
            <div class="icone-etapa"><i class="fa-regular fa-user"></i></div>
            <span class="texto-etapa">Seus dados</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item ativa">
            <div class="icone-etapa"><i class="fa-solid fa-dog"></i></div>
            <span class="texto-etapa">Dados do pet</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item">
            <div class="icone-etapa"><i class="fa-solid fa-scissors"></i></div>
            <span class="texto-etapa">Serviço</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item">
            <div class="icone-etapa"><i class="fa-regular fa-calendar"></i></div>
            <span class="texto-etapa">Dia e horário</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item">
            <div class="icone-etapa"><i class="fa-regular fa-clipboard"></i></div>
            <span class="texto-etapa">Revisão</span>
        </div>
    </div>

<main class="conteudo">

<form class="formulario" >

    <h2 class="titulo">Dados do pet</h2>
    <p class="subtitulo">Etapa 2 de 5</p>

    <label class="label" for="nome" >Nome do pet </label>
    <input class="campo" type="text" id="nome" placeholder="Ex.:Thor" required>

    <label class="label" for="idade">Idade</label>
    <input class="campo" type="text" id="idade" placeholder="Ex.:3 anos" required>

    <label class="label" for="temperamento">Temperamento</label>
    <select class="temperamento" id="temperamento" required>
        <option>Calmo</option>
        <option>Brincalhão</option>
        <option>Agitado</option>
        <option>Tímido</option>
        <option>Sociável</option>
        <option>Protetor</option>
    </select>

    <label class="label" for="raca">Raça</label>
    <input class="campo" type="text" id="raca" placeholder="Ex.:Poodle" required>

    <footer class="botoes">
        <a class="botao voltar" href="dados.html">Voltar</a>
        <button class="botao continuar" type="submit" formaction="servico.html">Continuar</button>
    </footer>

</form>

</main>

</body>
</html>
