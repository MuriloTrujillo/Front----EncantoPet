<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encanto Pet</title>
    <link rel="stylesheet" href="DadosPet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="cabecalho-principal">
    <img src="Logo.jpeg" alt="Logo Encanto PET" class="imagem-logo">
    <h1 class="titulo-cabecalho">Encanto </h1>
    <h1 class="destaque-pet"> Pet</h1>

</header>

    <!-- Barra de Progresso -->
    <div class="conteiner-etapas">
        <div class="etapa-item concluida">
            <div class="icone-etapa"><i class="fa-regular fa-user"></i></div>
            <span class="texto-etapa">Seus dados</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item concluida">
            <div class="icone-etapa"><i class="fa-solid fa-dog"></i></div>
            <span class="texto-etapa">Dados do pet</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item ativa">
            <div class="icone-etapa"><i class="fa-solid fa-scissors"></i></div>
            <span class="texto-etapa">Serviço</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item">
            <div class="icone-etapa"><i class="fa-regular fa-calendar"></i></div>
            <span class="texto-etapa">Dia e horário</span>
        </div>
        <div class="linha-conectora"></div>
        
        <div class="etapa-item">
            <div class="icone-etapa"><i class="fa-regular fa-clipboard"></i></div>
            <span class="texto-etapa">Revisão</span>
        </div>
    </div>

<main class="conteudo">

<form class="formulario">
    <h2 class="titulo">Serviço</h2>
    <p class="subtitulo">Etapa 3 de 5</p>

    <form action="etapa4.html" method="get">

        <div class="lista-servicos">

            <label class="opcao">
                <input type="checkbox" name="servicos" value="Banho e tosa">
                <print class="icone">✂</print>
                <print>Banho e tosa</print>
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="Banho">
                <print class="icone">✂</print>
                <print>Banho</print>
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="Somente tosa">
                <print class="icone">✂</print>
                <print>Somente tosa</print>
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="Tosa higiênica">
                <print class="icone">✂</print>
                <print>Tosa higiênica</print>
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="Hidratação">
                <print class="icone">✂</print>
                <print>Hidratação</print>
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="Corte de unhas">
                <print class="icone">✂</print>
                <print>Corte de unhas</print>
            </label>

        </div>

    <footer class="botoes">
        <a class="botao voltar" href="DadosPet.html">Voltar</a>
        <a class="botao continuar" href="">Continuar</a>
    </footer>


    </form>
</form>
</main>

</body>
</html>
